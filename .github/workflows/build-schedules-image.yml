name: build-schedules-image

# Builds apps/schedules (BullMQ heartbeat host — incl. the compute-session budget/TTL
# reaper wired in compute-heartbeat.ts) on GitHub's runners and pushes it to GHCR.
# Same reasoning as build-compute-image.yml: keep the space-constrained prod box from
# ever building anything itself.

on:
  push:
    branches: [feat/compute-session]
    paths:
      - "apps/schedules/**"
      - "packages/server/**"
      - "Dockerfile.schedule"
      - ".github/workflows/build-schedules-image.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free extra disk on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          df -h / | tail -1

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.schedule
          push: true
          tags: |
            ghcr.io/ramtinhoss/dokploy-schedules:compute
            ghcr.io/ramtinhoss/dokploy-schedules:compute-${{ github.sha }}
