name: build-compute-image

# Builds the Dokploy fork image (with the compute-session module) on GitHub's runners
# — which have ample disk — and pushes it to GHCR. The GCP box then just pulls + swaps,
# so the space-constrained prod box never builds anything.

on:
  push:
    branches: [feat/compute-session]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free extra disk on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          df -h / | tail -1

      - name: Create build-time .env.production
        run: echo "NODE_ENV=production" > .env.production

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/ramtinhoss/dokploy:compute
            ghcr.io/ramtinhoss/dokploy:compute-${{ github.sha }}
